name: Backend quality

on:
  push:
    branches: [main]
    paths: ["packages/**", "backend/**", "data/**", "pyproject.toml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["packages/**", "backend/**", "data/**", "pyproject.toml", ".github/workflows/backend.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the statistics package and the API
        run: |
          python -m pip install --upgrade pip
          pip install -e "./packages[dev]" -e "./backend[dev]" ruff

      - name: Lint (unused imports, undefined names)
        run: ruff check --select F packages/ab_stats backend/app

      - name: Statistics package tests
        run: pytest packages/ab_stats

      - name: API tests
        run: pytest backend/tests
        env:
          PYTHONPATH: packages:backend

      - name: Example dataset is reproducible
        run: |
          python data/relances_paiement/generate.py
          git diff --exit-code data/relances_paiement/relances_paiement.csv
