name: Docker quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the images
        run: docker compose build

      - name: Start the stack and check the API health endpoint
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Check that the frontend is served
        run: curl -fsS http://localhost:3000 | grep -q "<div id=\"root\">"

      - name: Stop the stack
        if: always()
        run: docker compose down
