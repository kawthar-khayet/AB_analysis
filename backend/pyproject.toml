[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-analysis-backend"
version = "0.1.0"
description = "FastAPI backend pour A/B Analysis Workspace"
requires-python = ">=3.11"
dependencies = [
    "ab_stats",
    "fastapi>=0.115",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
    "reportlab>=4.2",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
